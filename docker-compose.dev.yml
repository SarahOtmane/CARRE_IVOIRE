# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# With nginx:       --profile nginx

services:
  database:
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - carre_ivoire_network

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/package.json:/app/apps/api/package.json
      - ./packages:/app/packages
      - node_modules_api:/app/apps/api/node_modules
      - ./apps/api/uploads:/app/apps/api/uploads
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    command: npm run start:dev
    depends_on:
      database:
        condition: service_healthy

  front-office:
    build:
      context: .
      dockerfile: apps/front-office/Dockerfile
      target: development
    volumes:
      - ./apps/front-office/index.html:/app/index.html
      - ./apps/front-office/src:/app/src
      - ./apps/front-office/public:/app/public
      - ./packages:/app/packages
      - node_modules_front:/app/node_modules
    environment:
      VITE_API_URL:https://api.carre-ivoire/api/v1
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_xxx}
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend
    healthcheck:
      disable: true

  nginx:
    profiles:
      - nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - front-office
