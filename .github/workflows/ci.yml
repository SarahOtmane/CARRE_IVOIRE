name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspaces --if-present

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspaces --if-present

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test --workspaces --if-present

  test-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: carre_ivoire_test
          MYSQL_USER: carre_user
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: carre_ivoire_test
      DB_USER: carre_user
      DB_PASSWORD: ci_test_password
      JWT_SECRET: ci_test_jwt_secret_minimum_32_characters_xxxx
      JWT_EXPIRATION: 24h
      REFRESH_TOKEN_SECRET: ci_test_refresh_secret_minimum_32_chars_xxx
      REFRESH_TOKEN_EXPIRATION: 7d
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key_for_pipeline
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e --workspace=apps/api

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      # --audit-level=critical : multer (via @nestjs/platform-express) a 2 HIGH
      # sans correctif disponible dans l'écosystème (GHSA-72gw-mp4g-v24j,
      # GHSA-3p4h-7m6x-2hcm). On bloque sur CRITICAL uniquement ; zéro CRITICAL
      # actuellement. Les autres HIGH corrigés : NestJS 11, nodemailer v9, bcrypt v6.
      - run: npm audit --omit=dev --audit-level=critical
